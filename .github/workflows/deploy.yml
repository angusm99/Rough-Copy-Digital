name: Deploy to Netlify

# Manual only, from 2026-09-08. Every push to main used to deploy, which burned
# Netlify build credits on work-in-progress the reps were never going to see.
# Pushes still back the code up to GitHub; deploy when a build is field-ready:
#   gh workflow run "Deploy to Netlify"
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy open-design-components to Netlify
        run: >
          npx --yes netlify-cli deploy --prod --no-build
          --dir open-design-components
          --site 73800d07-6087-4563-b376-8afd9fed9d80
          --message "GitHub push ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
