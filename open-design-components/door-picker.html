<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Door Picker • Anglo Windows Digital Rough Copy</title>
  <style>
    :root {
      --bg: oklch(15.1% 0.009 239.8);
      --surface: oklch(19% 0.012 246);
      --surface-2: oklch(24% 0.014 248);
      --fg: oklch(92.5% 0.007 88.6);
      --muted: oklch(80% 0.028 87.6);
      --border: oklch(42% 0.02 252.3);
      --accent: oklch(86% 0.185 96);
      --outline-gold: color-mix(in oklab, var(--accent) 70%, var(--border));
      --outline-gold-strong: color-mix(in oklab, var(--accent) 88%, var(--border));
      --outline-gold-soft: color-mix(in oklab, var(--accent) 48%, var(--border));
      --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --font-body: "Segoe UI", "Segoe UI Variable Text", Inter, system-ui, sans-serif;
      --font-mono: "Cascadia Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, rgba(4, 6, 10, 0.72), rgba(4, 6, 10, 0.86)), linear-gradient(180deg, oklch(17% 0.01 245), var(--bg));
      color: var(--fg);
      font-family: var(--font-body);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .wrap {
      width: min(1220px, 100%);
      background: color-mix(in oklab, var(--surface) 92%, black 8%);
      border: 1px solid color-mix(in oklab, var(--border) 84%, white 16%);
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .head, .foot { padding: 18px 22px; }
    .head { border-bottom: 1px solid color-mix(in oklab, var(--border) 88%, white 12%); display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .head-left { display:grid; gap:10px; min-width:0; }
    .home-link { flex-shrink:0; display:inline-flex; align-items:center; border-radius:10px; padding:2px 4px; text-decoration:none; }
    .home-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .brand-logo { height: 34px; width: auto; display: block; }
    .head-actions { display:flex; gap:8px; flex-shrink:0; }
    .label {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .hidden { display: none !important; }
    h1 { margin: 0; font-size: 34px; font-family: var(--font-display); }
    .families, .configs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button, .option {
      border-radius: 10px;
      border: 1px solid color-mix(in oklab, var(--border) 84%, white 16%);
      background: color-mix(in oklab, var(--surface-2) 92%, black 8%);
      color: var(--fg);
      font: inherit;
      padding: 10px 13px;
      cursor: pointer;
    }
    .option.active { border-color: color-mix(in oklab, var(--accent) 56%, var(--border)); background: color-mix(in oklab, var(--accent) 10%, var(--surface-2)); }
    .body {
      display: grid;
      grid-template-columns: 1fr 320px;
      min-height: 0;
    }
    .catalog, .side {
      padding: 20px 22px;
      display: grid;
      gap: 14px;
      align-content: start;
      overflow-y: auto;
      max-height: calc(100vh - 290px);
      min-height: 320px;
    }
    .side {
      border-left: 1px solid color-mix(in oklab, var(--border) 88%, white 12%);
      background: color-mix(in oklab, var(--surface) 88%, black 12%);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .catalog-group {
      display: grid;
      gap: 12px;
    }
    .catalog-group-title {
      color: var(--accent);
      font-family: var(--font-display);
      font-size: 21px;
      letter-spacing: 0.02em;
      border-bottom: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
      padding-bottom: 6px;
    }
    .door-card {
      padding: 15px;
      border-radius: 16px;
      border: 1px solid color-mix(in oklab, var(--border) 84%, white 16%);
      background: color-mix(in oklab, var(--surface-2) 90%, black 10%);
      cursor: pointer;
      display: grid;
      gap: 10px;
    }
    .door-card.selected { border-color: color-mix(in oklab, var(--accent) 56%, var(--border)); }
    /* confirm straight from the card — no scrolling to the side panel */
    .card-use {
      margin-top: 2px; min-height: 44px; width: 100%;
      border-radius: 10px; cursor: pointer;
      border: 1px solid color-mix(in oklab, var(--accent) 55%, var(--border));
      background: color-mix(in oklab, var(--accent) 16%, var(--surface-2));
      color: var(--fg); font: inherit; font-weight: 600;
    }
    .card-use:hover { background: color-mix(in oklab, var(--accent) 30%, var(--surface-2)); }
    .door-card.selected .card-use {
      background: var(--accent); color: #1a1400; border-color: var(--accent);
    }
    .door-graphic {
      height: 120px;
      border-radius: 12px;
      border: 1px solid color-mix(in oklab, var(--border) 78%, var(--accent) 22%);
      background: color-mix(in oklab, var(--surface) 76%, black 24%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .door-graphic svg { width: 100%; height: 100%; }
    .head-actions .option { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    .head-actions .option svg { width: 15px; height: 15px; flex: none; }
    .door-graphic img, .svg-asset { width: 100%; height: 100%; object-fit: contain; display: block; }
    .panel {
      padding: 15px;
      border-radius: 16px;
      border: 1px solid color-mix(in oklab, var(--border) 84%, white 16%);
      background: color-mix(in oklab, var(--surface-2) 90%, black 10%);
    }
    .input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid color-mix(in oklab, var(--border) 84%, white 16%);
      background: color-mix(in oklab, var(--surface) 72%, var(--surface-2));
      color: var(--fg);
      font: inherit;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .panel-grid label { font-size: 13px; }
    .panel-grid .label { font-size: 11px; }
    .foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid color-mix(in oklab, var(--border) 88%, white 12%);
    }
    .primary { background: var(--accent); color: var(--bg); border: 0; font-weight: 700; }
    h2 { margin: 0 0 10px; font-size: 18px; }
    p { margin: 10px 0 0; line-height: 1.55; font-size: 13px; }
    @media (max-width: 980px) {
      .body { grid-template-columns: 1fr; }
      .side { border-left: 0; border-top: 1px solid color-mix(in oklab, var(--border) 88%, white 12%); }
      .cards { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .cards { grid-template-columns: 1fr; }
      .foot { display: grid; }
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // offline support for off-site tablet use (see sw.js)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        // updateViaCache:"none" is load-bearing: the default ("imports") checks
        // sw.js itself against the HTTP cache, and the preview server sends no
        // Cache-Control, so Chrome kept serving a stale worker. The old worker
        // then kept serving its own old asset cache, which is why bumping the
        // cache name twice never reached the tablet.
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
          .then((r) => console.info("[rc] offline ready:", r.scope))
          .catch((e) => console.warn("[rc] offline unavailable:", e.message));
      });
    }
  </script>
  <link rel="stylesheet" href="field-ui.css?v=20260908-field12" />
  <script src="sliding-configs.js?v=20260908-field12"></script>
  <script src="picker-reference.js?v=20260908-field12"></script>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="head-left">
        <a class="home-link" href="index.html" title="Home">
          <img class="brand-logo" src="assets/brand/anglo-logo-gold.png" alt="Anglo Windows" />
        </a>
        <div>
          <div class="label" id="lineCtx">No line selected — browsing</div>
          <h1>Pick the right door configuration.</h1>
          <div class="families" id="familyTabs">
            <button class="option active" data-family="hinged">Hinged</button>
            <button class="option" data-family="multislide">Heavy Duty Slider</button>
            <button class="option" data-family="vistafold">Sliding Folding</button>
            <button class="option" data-family="pivot">Pivot</button>
            <button class="option" data-family="patio">Patio Sliding</button>
          </div>
          <div class="families" id="hingedTabs">
            <button class="option active" data-hgroup="">All hinged</button>
            <button class="option" data-hgroup="Single Hinged (HD)">Single</button>
            <button class="option" data-hgroup="Double Hinged (HDD)">Double</button>
            <button class="option" data-hgroup="Stable (HDSTAB)">Stable</button>
          </div>
        </div>
      </div>
      <div class="head-actions">
        <button class="option" onclick="location.href='index.html'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px"><path d="M3 11l9-8 9 8M5 9.5V21h14V9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Home</button>
        <button class="option" onclick="location.href=workspaceUrl()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="2"/></svg> Workspace</button>
      </div>
    </header>
    <section class="body">
      <div class="catalog">
        <div class="label" id="sectionLabel">HINGED DOORS</div>
        <div id="doorCards"></div>
      </div>
      <aside class="side">
        <div class="panel">
          <div class="label">Selected door</div>
          <h2 id="doorTitle">---</h2>
<div id="selectedDoorPreview" class="live-door-preview" aria-label="Selected door preview"></div>
          <div class="panel-grid">
            <label><span class="label">Config</span><input id="configField" class="input" readonly /></label>
            <label><span class="label">Handle / lead side</span>
              <select id="handleField" class="input"></select>
            </label>
            <label id="hingeFieldLabel"><span class="label">Hinges</span><select id="hingeField"><option value="STANDARD">Standard hinges</option><option value="PARLIAMENT">Parliament hinges</option></select></label>
            <label><span class="label">Opening</span>
              <select id="openField" class="input"></select>
            </label>
            <label><span class="label">Code</span><input id="codeField" class="input" readonly /></label>
            <label><span class="label">Glass</span>
              <select id="glassField">
                <option>5mm TSG</option>
                <option>6mm TSG</option>
                <option>8mm TSG</option>
                <option>10mm TSG</option>
                <option>12mm TSG</option>
                <option>6.38mm Clear Lam</option>
                <option>8.38mm Clear Lam</option>
                <option>10.38mm Clear Lam</option>
                <option>12.38mm Clear Lam</option>
                <option>SPECIAL</option>
              </select>
            </label>
            <label class="hidden" id="customGlassField"><span class="label">Special glass variant</span>
              <input id="customGlassInput" class="input" placeholder="e.g. Low-E safety, tinted TSG" />
            </label>
            <label><span class="label">Colour</span><select id="colourField"><option>White</option><option>Aluminium</option></select></label>
          </div>
        </div>
        <div class="panel">
          <div class="label">Configuration note</div>
          <p id="configNote">Select a door configuration.</p>
        </div>
        <button class="primary" onclick="saveDoorSelection()" style="width:100%;margin-top:4px;min-height:48px;font-size:15px">Use selected door ✓</button>
      </aside>
    </section>
    <footer class="foot">
      <button onclick="location.href=workspaceUrl()">Back to workspace</button>
      <button class="primary" onclick="saveDoorSelection()">Use selected door</button>
    </footer>
  </div>

  <script src="door-drawings.js?v=field12"></script>
  <script src="picker-variants.js?v=field12"></script>
  <script>
    // ── Generated drawings in the Anglo architectural door style ─────────
    // Same language as the hand-drawn Anglo-HD/DD/PD assets: #c29b27 frame,
    // strong blue fixed / green sash glass, kick-height midrail band, gold
    // door-sash border, white dashed opening chevrons and slide arrows.
    // Drawn in mm so every config renders its true proportions.
    const { DOORS, doorSVG } = DoorDrawings;

    let currentFamily = 'hinged';
    let selectedDoor = null;

    function setSelectOptions(id, options, selected = '') {
      const el = document.getElementById(id);
      el.innerHTML = options.map((opt) => `<option value="${opt}">${opt || '— confirm —'}</option>`).join('');
      el.value = selected && options.includes(selected) ? selected : options[0];
    }

    function syncCustomGlassField() {
      const isSpecial = document.getElementById('glassField').value === 'SPECIAL';
      document.getElementById('customGlassField').classList.toggle('hidden', !isSpecial);
      if (!isSpecial) document.getElementById('customGlassInput').value = '';
    }

    function selectedGlassValue() {
      const glass = document.getElementById('glassField').value;
      if (glass !== 'SPECIAL') return { glass, customGlass: '' };
      const customGlass = document.getElementById('customGlassInput').value.trim();
      if (!customGlass) {
        alert('Type the special glass variant before using this door.');
        document.getElementById('customGlassInput').focus();
        return null;
      }
      return { glass: 'SPECIAL', customGlass };
    }

    function applyDoorDecisionOptions(door) {
      const family = door?.family || currentFamily;
      const handleOptions = ['', 'LEFT', 'RIGHT', 'CENTRE', 'CUSTOM'];
      const openOptions =
        (family === 'hinged' || family === 'pivot') ? ['', 'OPEN OUT', 'OPEN IN', 'CUSTOM'] :
        family === 'vistafold' ? ['', 'OPEN IN', 'OPEN OUT', 'STACK LEFT', 'STACK RIGHT', 'CUSTOM'] :
        ['', 'SLIDE LEFT', 'SLIDE RIGHT', 'BI-PART', 'CUSTOM'];

      document.getElementById('handleField').closest('label').classList.toggle('hidden', !!door?.panels);
      document.getElementById('openField').closest('label').classList.toggle('hidden', !!door?.panels);
      document.getElementById('hingeFieldLabel').classList.toggle('hidden', family!=='hinged');
      document.getElementById('hingeField').value=DoorDrawings.hingeType(door);
      const handleValue = (door?.lock || '').toUpperCase();
      const openingValue = (door?.open || (['hinged','pivot'].includes(family)?'Open out':'')).toUpperCase();
      setSelectOptions('handleField', handleOptions, handleOptions.includes(handleValue) ? handleValue : '');
      setSelectOptions('openField', openOptions, openOptions.includes(openingValue) ? openingValue : '');
    }

    function resetSelectionPanel() {
      document.getElementById('doorTitle').textContent = '---';
      document.getElementById('configField').value = '';
      document.getElementById('selectedDoorPreview').innerHTML='';
      document.getElementById('codeField').value = '';
      syncCustomGlassField();
      applyDoorDecisionOptions(null);
      document.getElementById('configNote').textContent = 'Select a door configuration.';
    }

    // Which hinged sub-group is showing (Single / Double / Stable), or null
    // for all. Reps were scrolling past nine singles to reach the doubles.
    let hingedGroupFilter = null;

    async function resolveVariants(card, family) {
      if (card.hands && card.hands.length > 1) {
        const config = await PickerVariants.chooseSliderConfig(
          card.hands[0], (c) => SlidingConfigs.svg(c, 900, 520));
        if (!config) return null;
        return { ...card, family, config, panels: config.split(''),
                 code: String(card.code).replace(card.hands[0], config),
                 label: String(card.label).replace(card.hands.join(' / '), config) };
      }
      if (card.stiles && card.stiles.length > 1) {
        const stile = await PickerVariants.chooseStile(card.stiles,
          (w) => doorSVG({ ...card, family, stile: w }, 200, 380));
        if (!stile) return null;
        return DoorDrawings.withStile({ ...card, family }, stile);
      }
      return { ...card, family };
    }

    function renderCatalog(family) {
      // Hinged shows one card per configuration; 60/90 is asked at Use this.
      let catalog = family === 'hinged' ? DoorDrawings.hingedCards() : DOORS[family];
      if (family === 'hinged' && hingedGroupFilter) {
        catalog = catalog.filter(d => (d.group || '') === hingedGroupFilter);
      }
      const groups = [];
      catalog.forEach((door) => {
        const key = door.group || 'Standard';
        let found = groups.find((g) => g.key === key);
        if (!found) {
          found = { key, items: [] };
          groups.push(found);
        }
        found.items.push(door);
      });

      document.getElementById('doorCards').innerHTML = groups.map((group) => `
        <section class="catalog-group">
          <div class="catalog-group-title">${group.key}</div>
          <div class="cards">
            ${group.items.map((door) => {
              const svgContent = doorSVG(door, 100, 80);
              return `
                <article class="door-card" data-id="${door.id}">
                  <div class="door-graphic">${svgContent}</div>
                  <strong>${door.label}</strong>
                  <div class="label">${door.code}</div>
                  <button class="card-use" data-use="${door.id}">Use this ✓</button>
                </article>
              `;
            }).join('')}
          </div>
        </section>
      `).join('');

      const labels = {
        pivot: 'PIVOT',
        patio: 'PATIO SLIDING',
        multislide: 'HEAVY DUTY SLIDER',
        vistafold: 'SLIDING FOLDING',
        hinged: 'HINGED DOORS'
      };
      document.getElementById('sectionLabel').textContent = labels[family];
      document.getElementById('hingedTabs').hidden = family !== 'hinged';

      document.querySelectorAll('.door-card').forEach(card => {
        card.addEventListener('click', () => selectDoor(family, card.dataset.id));
      });

      // Select + confirm in one tap, straight from the card. Reps were having
      // to scroll to the side panel to confirm a pick.
      document.querySelectorAll('.door-card [data-use]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const card = catalog.find(d => d.id === btn.dataset.use);
          if (!card) return;
          // One card per configuration: the hand (OX/XO) and the stile width
          // are asked here, with a drawing of each, instead of doubling the
          // number of near-identical cards on the page.
          const chosen = await resolveVariants(card, family);
          if (!chosen) return;              // rep cancelled
          selectDoor(family, chosen.id, chosen);
          saveDoorSelection();
        });
      });
    }

    function selectDoor(family, doorId, resolved) {
      const door = resolved || DOORS[family].find(d => d.id === doorId);
      if (!door) return;

      selectedDoor = { ...door, family };
      if(DoorDrawings.hinged(selectedDoor)) selectedDoor=DoorDrawings.openingVariant(selectedDoor,'OPEN OUT');
      selectedDoor.hingeType=DoorDrawings.hingeType(selectedDoor);

      document.querySelectorAll('.door-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`[data-id="${doorId}"]`)?.classList.add('selected');

      document.getElementById('doorTitle').textContent = selectedDoor.label;
      document.getElementById('configField').value = door.config || '';
      document.getElementById('codeField').value = selectedDoor.code;
      applyDoorDecisionOptions(selectedDoor);
      updateDoorPreview();
      document.getElementById('configNote').textContent =
        `${selectedDoor.label} Confirm handle side and opening before using this door.`;
    }

    document.getElementById('hingedTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-hgroup]');
      if (!btn) return;
      hingedGroupFilter = btn.dataset.hgroup || null;
      document.querySelectorAll('#hingedTabs .option').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCatalog('hinged');
    });

    document.getElementById('familyTabs').addEventListener('click', (e) => {
      if (!e.target.classList.contains('option')) return;

      document.querySelectorAll('#familyTabs .option').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      currentFamily = e.target.dataset.family;
      renderCatalog(currentFamily);
      selectedDoor = null;
      resetSelectionPanel();
    });

    function updateDoorPreview() {
      if (!selectedDoor) return;
      selectedDoor.handleSide = document.getElementById('handleField').value;
      const drawing = doorSVG(selectedDoor,100,80);
      const card = document.querySelector('.door-card.selected .door-graphic');
      if (card) card.innerHTML = drawing;
      document.getElementById('selectedDoorPreview').innerHTML = drawing;
    }
    document.getElementById('hingeField').addEventListener('change',()=> {
      if(!selectedDoor)return;
      selectedDoor=DoorDrawings.withHinges(selectedDoor,document.getElementById('hingeField').value);
      document.getElementById('codeField').value=selectedDoor.code;
      document.getElementById('doorTitle').textContent=selectedDoor.label;
      updateDoorPreview();
    });
    document.getElementById('handleField').addEventListener('change',updateDoorPreview);
    document.getElementById('openField').addEventListener('change',() => {
      if (!selectedDoor) return;
      selectedDoor = DoorDrawings.openingVariant(selectedDoor, document.getElementById('openField').value);
      document.getElementById('codeField').value = selectedDoor.code;
      document.getElementById('doorTitle').textContent = selectedDoor.label;
      document.getElementById('configNote').textContent = selectedDoor.label + ' — viewed from outside';
      updateDoorPreview();
    });
    function workspaceUrl() {
      return CTX && typeof CTX.i === 'number' ? `workspace.html?line=${CTX.i}` : 'workspace.html';
    }

    function saveDoorSelection() {
      if (!selectedDoor) {
        alert('Please select a door first.');
        return;
      }
      const glassChoice = selectedGlassValue();
      if (!glassChoice) return;

      if (CTX && typeof CTX.i === 'number') {
        const handleSide = selectedDoor.panels ? '' : document.getElementById('handleField').value;
        const openingDirection = selectedDoor.panels ? '' : document.getElementById('openField').value;
        const noteBits = [
          selectedDoor.config,
          handleSide && 'handle ' + handleSide,
          openingDirection
        ].filter(Boolean).join(' • ');
        localStorage.setItem('aw_picker_result', JSON.stringify({
          i: CTX.i, kind: 'door',
          code: selectedDoor.code,
          name: selectedDoor.label,
          family: selectedDoor.family,
          config: selectedDoor.config || '',
          handleSide,
          hingeType: selectedDoor.family==='hinged' ? document.getElementById('hingeField').value : '',
          openingDirection,
          note: noteBits,
          glass: glassChoice.glass,
          customGlass: glassChoice.customGlass,
          colour: document.getElementById('colourField').value,
          ...PickerReference.spec(),
          // thumbnail is mirrored to match the handing the rep just confirmed
          design: {...selectedDoor, handleSide},
          svg: doorSVG({ ...selectedDoor, handleSide }, 88, 64)
        }));
      }
      localStorage.removeItem('aw_picker_ctx');
      location.href = workspaceUrl();
    }

    // ── Line context from workspace (picker round-trip) ────────────────
    let CTX = null;
    try { CTX = JSON.parse(localStorage.getItem('aw_picker_ctx') || 'null'); } catch (e) {}
    if (CTX) {
      const bits = [];
      if (CTX.ref) bits.push('Line ' + CTX.ref);
      if (CTX.room) bits.push(CTX.room);
      if (CTX.quoteW && CTX.quoteH) bits.push('quote ' + CTX.quoteW + ' × ' + CTX.quoteH);
      document.getElementById('lineCtx').textContent = bits.join(' • ') || 'Pick for current line';
    }
    document.getElementById('glassField').addEventListener('change', syncCustomGlassField);

    // ── Keyboard: Enter confirms • Esc returns ──────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input, select, textarea')) return;
      if (e.key === 'Enter') { e.preventDefault(); saveDoorSelection(); }
      else if (e.key === 'Escape') { location.href = workspaceUrl(); }
    });

    // bfcache restore skips script load → stale line context; force a reload
    window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

    applyDoorDecisionOptions(null);
    renderCatalog('hinged');
  </script>
</body>
</html>
